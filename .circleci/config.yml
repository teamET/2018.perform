# Javascript Node CircleCI 2.0 configuration file
# Check https://circleci.com/docs/2.0/language-javascript/ for more details

version: 2
jobs:
  build:
      #    working_directory: ~/repo
      #    working_directory: ~/api-server
    working_directory: ~/2018.perform/
    docker:
      - image: circleci/node:7.10
    steps:
      - checkout
      - restore_cache:
          keys:
          - v1-dependencies-{{ checksum "package.json" }}
          # fallback to using the latest cache if no exact match is found
          - v1-dependencies-
      - run: 
          name: install packages
          #working_directory: ~/2018.perform/api-server
          command: cd api-server && yarn && yarn install && yarn test
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}

  test:
    working_directory: ~/2018.perform/
        #    working_directory: ~/api-server
    docker:
      - image: circleci/node:7.10
    steps:
      - checkout
      - restore_cache:
          keys:
          - v1-dependencies-{{ checksum "api-server/package.json" }}
          - v1-dependencies-
      - run: 
          name: test express server
          working_directory: ~/2018.perform/api-server
          command: yarn test

  deploy:
    machine: true
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "1a:a6:fc:8f:09:ba:34:32:a0:ca:d8:97:de:ea:b0:35"
      - start_ssh_scan:
		  command: |
            ssh-keyscan ${HOST_NAME} >> ~/.ssh/known_hosts
      - start_ssh:
          commnad: |
            ssh ${USER_NAME}@${HOST_NAME} "touch test.txt && echo 'from ci' >> ./test.txt"

workflows:
    version: 2
    build_and_test:
        jobs:
            - build
            - deploy
